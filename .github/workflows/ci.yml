name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Manual debug suite
        working-directory: python
        run: python manual_debug.py --cpu

      - name: Smoke - engine demo
        run: python -m tianji.cli demo

      - name: Smoke - ingest sample ccsniff rows
        run: python -m tianji.cli ingest-ccsniff --batch 4